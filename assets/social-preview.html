<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio social preview artwork</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #0b1220; color: #e2e8f0; font-family: Arial, sans-serif; }
main { position: relative; width: 1200px; height: 630px; padding: 78px 76px; border-bottom: 14px solid #2dd4bf; }
.eyebrow { margin: 0 0 30px; color: #2dd4bf; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; }
h1 { margin: 0 0 20px; font-size: 78px; letter-spacing: -3px; }
.role { margin: 0; font-size: 36px; line-height: 1.3; font-weight: 600; }
.location { margin: 26px 0 0; font-size: 25px; color: #b0bdd0; }
.url { position: absolute; bottom: 57px; left: 76px; margin: 0; font-size: 25px; color: #2dd4bf; }
img { position: absolute; width: 290px; height: 290px; top: 154px; right: 76px; object-fit: cover; border-radius: 50%; border: 5px solid #334155; }
</style>
</head>
<body>
<main>
<p class="eyebrow">Engineering portfolio</p>
<h1>Alan Fong</h1>
<p class="role">DevOps &amp;<br>Automation Engineer</p>
<p class="location">Johor Bahru, Malaysia</p>
<p class="url">alanfong93.github.io</p>
<img src="../profile.jpg" alt="Alan Fong">
</main>
</body>
</html>
